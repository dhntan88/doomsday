name: Auto Commit Signal Log + Telegram (Gist Mode)

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '*/5 * * * 1-5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install requests pandas numpy scikit-learn joblib yfinance google-generativeai

      - name: Download Secure Quant Script from Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_SECRET_TOKEN }}
        run: |
          # Mendownload skrip python privat langsung dari Gist Anda menggunakan ID baru
          curl -H "Authorization: token $GIST_TOKEN" \
               -H "Accept: application/vnd.github.v3.raw" \
               -L https://api.github.com/gists/43873d10bcc8b9096bd895c9ebd537a5 \
               -o quant_agent.py

      - name: Run Downloaded Quant Agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python quant_agent.py

      - name: Commit changes (Hanya Log)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git stash
          git pull origin main --rebase || echo "No rebase needed"
          git stash pop || echo "No stash to pop"
          git add signal_log.json
          git commit -m "Update signal log via Gist-secured execution" || echo "No changes"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/dhntan88/doomsday.git HEAD:main
