name: Auto Commit Signal Log + Telegram

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '*/15 * * * 1-5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install requests pandas numpy scikit-learn joblib yfinance google-generativeai

      - name: Run Quant-Grade Autonomous Agent (Triple Barrier + Advanced Features)
        run: |
          python - <<'EOF'
          import os, json, datetime, requests
          import pandas as pd
          import numpy as np
          import yfinance as yf
          import joblib
          from sklearn.neural_network import MLPClassifier
          from sklearn.preprocessing import StandardScaler
          from sklearn.pipeline import make_pipeline
          import google.generativeai as genai

          # --- PENGAMAN WEEKEND & JUMAT MALAM (HINDARI GAP) ---
          now_utc = datetime.datetime.now(datetime.timezone.utc)
          current_weekday = now_utc.weekday()
          current_hour = now_utc.hour

          if current_weekday >= 5 or (current_weekday == 4 and current_hour >= 20):
              print("Market mendekati penutupan akhir pekan / sedang libur. Bot dihentikan.")
              exit(0)

          TELEGRAM_BOT_TOKEN = os.getenv("TELEGRAM_BOT_TOKEN")
          TELEGRAM_CHAT_ID = os.getenv("TELEGRAM_CHAT_ID")
          GEMINI_API_KEY = os.getenv("GEMINI_API_KEY")

          def send_telegram(message):
              if not TELEGRAM_BOT_TOKEN or not TELEGRAM_CHAT_ID:
                  print("Telegram Token/Chat ID belum diset!")
                  return
              url = f"https://api.telegram.org/bot{TELEGRAM_BOT_TOKEN}/sendMessage"
              payload = {
                  "chat_id": TELEGRAM_CHAT_ID,
                  "text": message,
                  "parse_mode": "Markdown"
              }
              try:
                  requests.post(url, json=payload, timeout=10)
              except Exception as e:
                  print("Gagal kirim pesan ke Telegram:", e)

          print("Memulai Quant-Grade Autonomous Agent...")

          # --- 1. Ambil Data Harga & Spot Live ---
          try:
              r = requests.get("https://xaus.com/api/v1/spot")
              data = r.json()
              spot_price = float(data.get("spot_usd_oz"))
          except Exception as e:
              print("API xaus.com error:", e)
              spot_price = None

          # Ambil data historis untuk fitur kuantitatif
          df_macro = yf.download("GC=F", period="60d", interval="60m")
          if isinstance(df_macro.columns, pd.MultiIndex):
              df_macro.columns = df_macro.columns.get_level_values(0)

          current_time_str = now_utc.strftime("%Y-%m-%d %H:%M:%S")
          current_date_str = now_utc.strftime("%Y-%m-%d")
          current_year_month = now_utc.strftime("%Y-%m")
          current_year, current_week, _ = now_utc.isocalendar()

          log_file = "signal_log.json"
          logs = []
          if os.path.exists(log_file):
              try:
                  with open(log_file, "r") as f:
                      logs = json.load(f)
              except:
                  logs = []

          has_active_order = False
          if logs:
              last_log = logs[-1]
              if last_log.get("status") == "OPEN":
                  has_active_order = True

          # --- 2. JIKA ADA ORDER AKTIF: TUTUP & EVALUASI ---
          if has_active_order and spot_price is not None:
              last_log = logs[-1]
              last_pred = last_log.get("prediction")
              last_price = last_log.get("spot_price")
              
              if last_price and last_pred is not None:
                  price_diff = spot_price - last_price
                  diff_pips = round(price_diff * 10, 1)
                  actual_direction = 1 if spot_price > last_price else (0 if spot_price < last_price else -1)
                  
                  is_win = (last_pred == actual_direction)
                  last_log["status"] = "CLOSED"
                  last_log["close_price"] = spot_price
                  last_log["close_time"] = current_time_str
                  last_log["result"] = "WIN" if is_win else "LOSS"
                  
                  if is_win:
                      signed_pips = abs(diff_pips)
                  else:
                      signed_pips = -abs(diff_pips)
                      
                  last_log["diff_pips"] = abs(diff_pips)
                  last_log["signed_pips"] = signed_pips

                  status_icon = "✅ WIN" if is_win else "❌ LOSS"
                  arah_lama = "BUY" if last_pred == 1 else "SELL"
                  
                  msg_close = (
                      f"🔴 *[CLOSE ORDER - QUANT EVAL]*\n"
                      f"-----------------------------\n"
                      f"⏱ *Waktu Close:* `{current_time_str}` UTC\n"
                      f"💰 *Harga Close:* `${spot_price}`\n"
                      f"📌 *Order Asal:* {arah_lama} di `${last_price}`\n"
                      f"📊 *Hasil:* {status_icon} (`{signed_pips:+.1f}` pips)"
                  )
                  send_telegram(msg_close)
                  
                  with open(log_file, "w") as f:
                      json.dump(logs, f, indent=4)
                      
                  has_active_order = False

          # --- 3. TRAINING DENGAN TRIPLE BARRIER METHOD & ADVANCED FEATURES ---
          def get_quant_training_data():
              df = yf.download("GC=F", period="1y", interval="60m")
              if isinstance(df.columns, pd.MultiIndex):
                  df.columns = df.columns.get_level_values(0)
              if df.empty:
                  return None, None

              close = df['Close'].squeeze()
              high = df['High'].squeeze()
              low = df['Low'].squeeze()

              # Feature Engineering: Lag, Volatilitas (Rolling Std), dan Trend Filter
              features_df = pd.DataFrame(index=close.index)
              for i in range(1, 25):
                  features_df[f'lag_{i}'] = close.pct_change(i)
              
              features_df['volatility'] = close.rolling(window=14).std()
              features_df['sma_trend'] = close > close.rolling(window=50).mean()

              # Triple Barrier Method Labeling (TP = +30 pips / ~3 poin, SL = -20 pips / ~2 poin, Timeout = 5 candle)
              tp_pips = 3.0
              sl_pips = 2.0
              timeout = 5

              labels = []
              for i in range(len(close) - timeout):
                  entry_price = close.iloc[i]
                  h_slice = high.iloc[i+1:i+1+timeout]
                  l_slice = low.iloc[i+1:i+1+timeout]

                  hit_tp = (h_slice >= entry_price + tp_pips).any()
                  hit_sl = (l_slice <= entry_price - sl_pips).any()

                  if hit_tp and not hit_sl:
                      labels.append(1) # BUY / WIN Triple Barrier
                  elif hit_sl and not hit_tp:
                      labels.append(0) # SELL / WIN Triple Barrier (atau gagal buy)
                  else:
                      labels.append(-1) # Netral / Timeout

              features_df['target'] = pd.Series(labels, index=features_df.index[:len(labels)])
              features_df = features_df.dropna()
              
              # Filter hanya target 1 (Buy setup valid) atau 0 (Sell setup valid)
              features_df = features_df[features_df['target'].isin([0, 1])]

              X = features_df[[col for col in features_df.columns if col != 'target']]
              y = features_df['target']
              return X, y

          X_train, y_train = get_quant_training_data()
          if X_train is not None and not X_train.empty:
              try:
                  sample_weights = np.ones(len(X_train))
                  if logs:
                      for log in logs:
                          if log.get("result") == "LOSS":
                              sample_weights = sample_weights * 1.03

                  model = make_pipeline(
                      StandardScaler(),
                      MLPClassifier(hidden_layer_sizes=(64, 32), max_iter=800, random_state=42)
                  )
                  model.fit(X_train, y_train, mlpclassifier__sample_weight=sample_weights[:len(X_train)])
                  joblib.dump(model, "model_quant.pkl")
              except Exception as e:
                  print("Error training model quant:", e)

          prediction, confidence = -1, 0
          if os.path.exists("model_quant.pkl") and not df_macro.empty:
              try:
                  close_live = df_macro['Close'].squeeze()
                  high_live = df_macro['High'].squeeze()
                  low_live = df_macro['Low'].squeeze()

                  live_features = [(close_live.iloc[-1] - close_live.iloc[-1-i]) / close_live.iloc[-1-i] for i in range(1, 25)]
                  live_vol = close_live.rolling(window=14).std().iloc[-1]
                  live_trend = 1.0 if close_live.iloc[-1] > close_live.rolling(window=50).mean().iloc[-1] else 0.0
                  
                  live_vector = np.array([live_features + [live_vol, live_trend]])

                  ml_model = joblib.load("model_quant.pkl")
                  pred_class = ml_model.predict(live_vector)[0]
                  proba = ml_model.predict_proba(live_vector)[0]
                  
                  prediction = int(pred_class)
                  confidence = int(max(proba) * 100)
              except Exception as e:
                  print("Error prediksi live quant:", e)

          # --- 4. KEPUTUSAN FINAL & EKSEKUSI ---
          if not has_active_order:
              if confidence >= 85 and spot_price is not None:
                  arah_teks = "📈 BUY / NAIK" if prediction == 1 else "📉 SELL / TURUN"
                  
                  ai_statement = "Setup teridentifikasi lolos validasi Triple Barrier Method."
                  if GEMINI_API_KEY:
                      try:
                          genai.configure(api_key=GEMINI_API_KEY)
                          gem_model = genai.GenerativeModel('gemini-2.5-flash')
                          prompt = f"Analis kuantitatif emas: Harga spot ${spot_price}, model Triple Barrier memprediksi {arah_teks} dengan keyakinan {confidence}%. Berikan 1 kalimat analisis probabilitas risiko."
                          resp = gem_model.generate_content(prompt)
                          if resp and resp.text:
                              ai_statement = resp.text.strip()
                      except:
                          pass

                  new_log = {
                      "status": "OPEN",
                      "open_time": current_time_str,
                      "date": current_date_str,
                      "spot_price": spot_price,
                      "prediction": prediction,
                      "confidence": confidence,
                      "close_price": None,
                      "result": None,
                      "diff_pips": 0,
                      "signed_pips": 0
                  }
                  logs.append(new_log)
                  if len(logs) > 200:
                      logs = logs[-200:]

                  with open(log_file, "w") as f:
                      json.dump(logs, f, indent=4)

                  def calc_stats(filtered_logs):
                      closed = [l for l in filtered_logs if l.get("status") == "CLOSED"]
                      total = len(closed)
                      if total == 0:
                          return 0, 0, 0.0, 0.0, "0W-0L (0.0%) | 0.0 pips"
                      wins = sum(1 for l in closed if l.get("result") == "WIN")
                      losses = sum(1 for l in closed if l.get("result") == "LOSS")
                      winrate = round((wins / total) * 100, 1)
                      total_pips = sum(l.get("signed_pips", 0) for l in closed)
                      return wins, losses, winrate, total_pips, f"{wins}W-{losses}L ({winrate}%) | {total_pips:+.1f} pips"

                  daily_logs = [l for l in logs if l.get("date") == current_date_str]
                  weekly_logs = []
                  for l in logs:
                      if "close_time" in l and l["close_time"]:
                          try:
                              dt = datetime.datetime.strptime(l["close_time"], "%Y-%m-%d %H:%M:%S")
                              if dt.isocalendar()[0] == current_year and dt.isocalendar()[1] == current_week:
                                  weekly_logs.append(l)
                          except:
                              pass
                  monthly_logs = [l for l in logs if l.get("close_time") and l["close_time"].startswith(current_year_month)]

                  w_w, w_l, w_wr, w_pips, stat_mingguan = calc_stats(weekly_logs)
                  _, _, _, _, stat_harian = calc_stats(daily_logs)
                  _, _, _, _, stat_bulanan = calc_stats(monthly_logs)

                  advisor_tip = "Sistem Triple Barrier aktif dan stabil."
                  if (w_w + w_l) >= 3 and w_wr < 40:
                      advisor_tip = "💡 *Saran AI:* Winrate di bawah 40%. Naikkan threshold confidence ke `90`."

                  msg_open = (
                      f"🟢 *[OPEN ORDER - QUANT TRIPLE BARRIER]*\n"
                      f"-----------------------------\n"
                      f"⏱ *Waktu Entry:* `{current_time_str}` UTC\n"
                      f"💰 *Harga Entry:* `${spot_price}`\n"
                      f"🔮 *Posisi Baru:* *{arah_teks}*\n"
                      f"🎯 *Keyakinan AI:* `{confidence}%`\n\n"
                      f"📐 *Analisis Kuantitatif:* _{ai_statement}_\n\n"
                      f"📈 *Statistik Performa:*\n"
                      f"• *Harian:* {stat_harian}\n"
                      f"• *Mingguan:* {stat_mingguan}\n"
                      f"• *Bulanan:* {stat_bulanan}\n\n"
                      f"{advisor_tip}"
                  )
                  send_telegram(msg_open)
                  print("Order baru dibuka dengan metode Triple Barrier.")
              else:
                  print(f"Bot istirahat (Wait & See). Confidence: {confidence}%")
          else:
              print("Menunggu siklus order aktif selesai.")
          EOF
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git stash
          git pull origin main --rebase || echo "No rebase needed"
          git stash pop || echo "No stash to pop"
          git add model_quant.pkl signal_log.json
          git commit -m "Upgrade model to Triple Barrier quantitative labeling method" || echo "No changes"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/dhntan88/doomsday.git HEAD:main
