name: Auto Commit Signal Log + Telegram

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '*/15 * * * *'    # tiap 15 menit UTC
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install requests pandas numpy scikit-learn joblib yfinance

      - name: Run Auto-Training & Telegram Signal Bot
        run: |
          python - <<'EOF'
          import os, json, datetime, requests
          import pandas as pd
          import numpy as np
          import yfinance as yf
          import joblib
          from sklearn.neural_network import MLPClassifier
          from sklearn.preprocessing import StandardScaler
          from sklearn.pipeline import make_pipeline

          # Konfigurasi Telegram (mengambil dari Secrets GitHub)
          TELEGRAM_BOT_TOKEN = os.getenv("TELEGRAM_BOT_TOKEN")
          TELEGRAM_CHAT_ID = os.getenv("TELEGRAM_CHAT_ID")

          def send_telegram(message):
              if not TELEGRAM_BOT_TOKEN or not TELEGRAM_CHAT_ID:
                  print("Telegram Token atau Chat ID belum diset di Secrets!")
                  return
              url = f"https://api.telegram.org/bot{TELEGRAM_BOT_TOKEN}/sendMessage"
              payload = {
                  "chat_id": TELEGRAM_CHAT_ID,
                  "text": message,
                  "parse_mode": "Markdown"
              }
              try:
                  requests.post(url, json=payload, timeout=10)
              except Exception as e:
                  print("Gagal kirim pesan ke Telegram:", e)

          print("Memulai proses training Deep Neural Network (Pips/Points Evaluation Added)...")

          # --- 1. Ambil Data Historis Jangka Panjang ---
          def get_long_df(interval, period):
              df = yf.download("GC=F", period=period, interval=interval)
              if isinstance(df.columns, pd.MultiIndex):
                  df.columns = df.columns.get_level_values(0)
              return df

          df_macro = get_long_df("60m", "1y")

          if not df_macro.empty:
              try:
                  close = df_macro['Close'].squeeze()
                  
                  features_df = pd.DataFrame(index=close.index)
                  lookback_window = 48
                  for i in range(1, lookback_window + 1):
                      features_df[f'lag_{i}'] = close.pct_change(i)

                  features_df['target'] = (close.shift(-1) > close).astype(int)
                  features_df = features_df.dropna()

                  feature_cols = [col for col in features_df.columns if col != 'target']
                  X = features_df[feature_cols]
                  y = features_df['target']

                  model = make_pipeline(
                      StandardScaler(),
                      MLPClassifier(
                          hidden_layer_sizes=(128, 64, 32), 
                          activation='relu', 
                          solver='adam', 
                          max_iter=1000, 
                          random_state=42
                      )
                  )
                  model.fit(X, y)
                  joblib.dump(model, "model_pure.pkl")
              except Exception as e:
                  print("Error saat training otomatis:", e)

          # --- 2. Ambil Harga Spot Live dari xaus.com ---
          try:
              r = requests.get("https://xaus.com/api/v1/spot")
              data = r.json()
              spot_price = float(data.get("spot_usd_oz"))
          except Exception as e:
              print("API xaus.com error:", e)
              spot_price = None

          prediction, confidence = -1, 0
          live_features = []

          # --- 3. Ambil Data 1h Terakhir untuk Prediksi Live ---
          df_live = get_long_df("60m", "60d")
          if not df_live.empty and os.path.exists("model_pure.pkl"):
              try:
                  close_live = df_live['Close'].squeeze()
                  
                  for i in range(1, 49):
                      pct = (close_live.iloc[-1] - close_live.iloc[-1-i]) / close_live.iloc[-1-i]
                      live_features.append(pct)

                  features = np.array([live_features])

                  ml_model = joblib.load("model_pure.pkl")
                  pred_class = ml_model.predict(features)[0]
                  proba = ml_model.predict_proba(features)[0]
                  conf_score = int(max(proba) * 100)

                  prediction = int(pred_class)
                  confidence = conf_score
              except Exception as e:
                  print("Error saat prediksi live:", e)

          # --- 4. Evaluasi Log, Hitung Pips/Selisih, & Catat Log Baru ---
          now_utc = datetime.datetime.now(datetime.timezone.utc)
          current_time_str = now_utc.strftime("%Y-%m-%d %H:%M:%S")
          current_date_str = now_utc.strftime("%Y-%m-%d")
          
          log_file = "signal_log.json"
          logs = []
          if os.path.exists(log_file):
              try:
                  with open(log_file, "r") as f:
                      logs = json.load(f)
              except:
                  logs = []

          # Cek hasil prediksi sebelumnya & hitung selisih pips/poin harga
          evaluation_text = "Siklus awal / Belum ada evaluasi sebelumnya."
          if logs and spot_price is not None:
              last_log = logs[-1]
              last_pred = last_log.get("prediction")
              last_price = last_log.get("spot_price")
              
              if last_price and last_pred is not None:
                  price_diff = spot_price - last_price
                  # Untuk XAUUSD, selisih 1.0 setara dengan 10 pips (atau kita tampilkan langsung nilai selisih dolarnya)
                  diff_pips = round(price_diff * 10, 1)
                  
                  actual_direction = 1 if spot_price > last_price else (0 if spot_price < last_price else -1)
                  
                  if last_pred == actual_direction:
                      evaluation_text = f"✅ TEPAT | Harga bergerak {abs(round(price_diff, 2))} poin ({abs(diff_pips)} pips) searah."
                      last_log["result"] = "WIN"
                      last_log["diff_pips"] = abs(diff_pips)
                  else:
                      evaluation_text = f"❌ MELESET (Loss) | Meleset sejauh {abs(round(price_diff, 2))} poin ({abs(diff_pips)} pips) berlawanan arah."
                      last_log["result"] = "LOSS"
                      last_log["diff_pips"] = abs(diff_pips)

          # Simpan log baru
          new_log = {
              "time": current_time_str,
              "date": current_date_str,
              "spot_price": spot_price,
              "prediction": prediction,
              "confidence": confidence,
              "result": None,
              "diff_pips": 0
          }
          logs.append(new_log)
          if len(logs) > 200:
              logs = logs[-200:]
          
          with open(log_file, "w") as f:
              json.dump(logs, f, indent=4)

          # --- Hitung Performa Harian & Total Pips Akumulasi ---
          today_wins = 0
          today_losses = 0
          total_pips_won = 0
          total_pips_lost = 0
          
          for log in logs:
              if log.get("date") == current_date_str:
                  res = log.get("result")
                  pips = log.get("diff_pips", 0)
                  if res == "WIN":
                      today_wins += 1
                      total_pips_won += pips
                  elif res == "LOSS":
                      today_losses += 1
                      total_pips_lost += pips
          
          total_today = today_wins + today_losses
          win_rate = int((today_wins / total_today * 100)) if total_today > 0 else 0
          
          if total_today > 0:
              net_pips = total_pips_won - total_pips_lost
              perf_text = f"📊 Win: {today_wins} | Loss: {today_losses} (Win Rate: {win_rate}%)\n⚖️ Net Pips Hari Ini: `{net_pips:+.1f}` pips"
          else:
              perf_text = "📊 Belum ada data selesai hari ini."

          # --- 5. Statement AI Murni ---
          if prediction == 1:
              ai_statement = "Dari pembacaan pola riwayat jangka panjang, struktur harga mengindikasikan dorongan akumulasi naik."
          elif prediction == 0:
              ai_statement = "Dari pembacaan pola riwayat jangka panjang, struktur harga mengindikasikan tekanan distribusi turun."
          else:
              ai_statement = "Pola pergerakan sedang berada di area transisi yang belum jelas."

          # --- 6. Kirim ke Telegram ---
          arah_teks = "📈 BUY / NAIK" if prediction == 1 else ("📉 SELL / TURUN" if prediction == 0 else "FLAT/NETRAL")

          msg = (
              f"🤖 *XAUUSD Deep AI (Pure Price Action)*\n"
              f"⏱ Waktu (UTC): `{current_time_str}`\n"
              f"💰 Harga Spot: `${spot_price}`\n"
              f"🔮 Prediksi: *{arah_teks}* (Conf: `{confidence}%`)\n\n"
              f"💬 *Analisis Otak AI:*\n_{ai_statement}_\n\n"
              f"📋 *Evaluasi Sebelumnya:*\n{evaluation_text}\n\n"
              f"📈 *Performa Hari Ini:*\n{perf_text}"
          )

          send_telegram(msg)
          print("Pesan dengan kalkulasi pips berhasil dikirim ke Telegram!")
          EOF
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit changes (Model & Log)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git stash
          git pull origin main --rebase || echo "No rebase needed"
          git stash pop || echo "No stash to pop"
          git add model_pure.pkl signal_log.json
          git commit -m "Add precise pips/points calculation to evaluation log" || echo "No changes"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/dhntan88/doomsday.git HEAD:main
