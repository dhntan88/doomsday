name: Auto Commit Signal Log + Telegram

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '*/15 * * * 1-5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # perlu ini supaya GITHUB_TOKEN boleh bikin GitHub Release
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Restore model cache (grows over time, does not bloat git repo)
        uses: actions/cache@v4
        with:
          path: |
            model_quant.pkl
            model_meta.json
          key: quant-model-${{ github.run_id }}
          restore-keys: |
            quant-model-

      - name: Install dependencies
        run: |
          pip install requests pandas numpy scikit-learn joblib yfinance google-generativeai

      - name: Run Optimized Quant Agent (Continual Learning, Two-Way Barrier, Weekly Backup)
        id: quant_agent
        run: |
          python - <<'EOF'
          import os, json, datetime, requests
          import pandas as pd
          import numpy as np
          import yfinance as yf
          import joblib
          from sklearn.neural_network import MLPClassifier
          from sklearn.preprocessing import StandardScaler
          from sklearn.pipeline import make_pipeline
          import google.generativeai as genai

          # --- 1. PENGAMAN WAKTU & JUMAT CUTOFF (Disesuaikan ke 21:30 UTC) ---
          now_utc = datetime.datetime.now(datetime.timezone.utc)
          current_weekday = now_utc.weekday()
          current_hour = now_utc.hour
          current_minute = now_utc.minute

          if current_weekday >= 5 or (current_weekday == 4 and (current_hour > 21 or (current_hour == 21 and current_minute >= 30))):
              print("Market mendekati penutupan akhir pekan / libur. Bot dihentikan.")
              exit(0)

          TELEGRAM_BOT_TOKEN = os.getenv("TELEGRAM_BOT_TOKEN")
          TELEGRAM_CHAT_ID = os.getenv("TELEGRAM_CHAT_ID")
          GEMINI_API_KEY = os.getenv("GEMINI_API_KEY")

          def send_telegram(message):
              if not TELEGRAM_BOT_TOKEN or not TELEGRAM_CHAT_ID:
                  return
              url = f"https://api.telegram.org/bot{TELEGRAM_BOT_TOKEN}/sendMessage"
              payload = {"chat_id": TELEGRAM_CHAT_ID, "text": message, "parse_mode": "Markdown"}
              try:
                  requests.post(url, json=payload, timeout=10)
              except Exception as e:
                  print("Telegram error:", e)

          print("Memulai Quant Agent dengan Integrasi Indikator Doomsday (EMA, RSI, ATR, Doom Bands)...")

          # Ambil Harga Spot Live
          try:
              r = requests.get("https://xaus.com/api/v1/spot")
              data = r.json()
              spot_price = float(data.get("spot_usd_oz"))
          except Exception as e:
              print("API spot error:", e)
              spot_price = None

          current_time_str = now_utc.strftime("%Y-%m-%d %H:%M:%S")
          current_date_str = now_utc.strftime("%Y-%m-%d")
          current_year_month = now_utc.strftime("%Y-%m")
          current_year, current_week, _ = now_utc.isocalendar()

          log_file = "signal_log.json"
          logs = []
          if os.path.exists(log_file):
              try:
                  with open(log_file, "r") as f:
                      logs = json.load(f)
              except:
                  logs = []

          has_active_order = False
          if logs and logs[-1].get("status") == "OPEN":
              has_active_order = True

          # --- 2. EVALUASI & CLOSE ORDER ---
          if has_active_order and spot_price is not None:
              last_log = logs[-1]
              last_pred = last_log.get("prediction")
              last_price = last_log.get("spot_price")
              
              if last_price and last_pred is not None:
                  price_diff = spot_price - last_price
                  diff_pips = round(price_diff * 10, 1)
                  actual_direction = 1 if spot_price > last_price else (0 if spot_price < last_price else -1)
                  
                  is_win = (last_pred == actual_direction)
                  last_log["status"] = "CLOSED"
                  last_log["close_price"] = spot_price
                  last_log["close_time"] = current_time_str
                  last_log["result"] = "WIN" if is_win else "LOSS"
                  
                  signed_pips = abs(diff_pips) if is_win else -abs(diff_pips)
                  last_log["diff_pips"] = abs(diff_pips)
                  last_log["signed_pips"] = signed_pips

                  status_icon = "✅ WIN" if is_win else "❌ LOSS"
                  arah_lama = "BUY" if last_pred == 1 else "SELL"
                  
                  msg_close = (
                      f"🔴 *[CLOSE ORDER - DOOMSDAY QUANT]*\n"
                      f"-----------------------------\n"
                      f"⏱ *Waktu Close:* `{current_time_str}` UTC\n"
                      f"💰 *Harga Close:* `${spot_price}`\n"
                      f"📌 *Order Asal:* {arah_lama} di `${last_price}`\n"
                      f"📊 *Hasil:* {status_icon} (`{signed_pips:+.1f}` pips)"
                  )
                  send_telegram(msg_close)
                  with open(log_file, "w") as f:
                      json.dump(logs, f, indent=4)
                  has_active_order = False

          # --- 3. TRAINING: FITUR TAMBAHAN (EMA, RSI, ATR, DOOM BANDS) & CONTINUAL LEARNING ---
          model_file = "model_quant.pkl"
          meta_file = "model_meta.json"

          meta_data = {}
          if os.path.exists(meta_file):
              try:
                  with open(meta_file, "r") as f:
                      meta_data = json.load(f)
              except:
                  meta_data = {}

          last_trained_date = meta_data.get("last_trained_date")
          should_retrain = (not os.path.exists(model_file)) or (last_trained_date != current_date_str)

          if should_retrain:
              print(f"Retrain hari ini ({current_date_str}). Terakhir training: {last_trained_date}")
              df_train = yf.download("GC=F", period="1y", interval="60m")
              if isinstance(df_train.columns, pd.MultiIndex):
                  df_train.columns = df_train.columns.get_level_values(0)
              
              if not df_train.empty:
                  close = df_train['Close'].squeeze()
                  high = df_train['High'].squeeze()
                  low = df_train['Low'].squeeze()

                  # Perhitungan Indikator Teknis (Sesuai script Pine Script Doomsday)
                  ema_fast = close.ewm(span=9, adjust=False).mean()
                  ema_slow = close.ewm(span=21, adjust=False).mean()
                  
                  # Kalkulasi RSI 14 manual dengan pandas
                  delta = close.diff()
                  gain = (delta.where(delta > 0, 0)).rolling(window=14).mean()
                  loss = (-delta.where(delta < 0, 0)).rolling(window=14).mean()
                  rs = gain / (loss + 1e-9)
                  rsi_series = 100 - (100 / (1 + rs))

                  # Kalkulasi ATR 14 manual
                  tr1 = high - low
                  tr2 = (high - close.shift()).abs()
                  tr3 = (low - close.shift()).abs()
                  tr = pd.concat([tr1, tr2, tr3], axis=1).max(axis=1)
                  atr_series = tr.rolling(window=14).mean()

                  upper_doom = ema_fast + (atr_series * 2)
                  lower_doom = ema_fast - (atr_series * 2)

                  # Konstruksi DataFrame Fitur
                  features_df = pd.DataFrame(index=close.index)
                  for i in range(1, 13):
                      features_df[f'lag_{i}'] = close.pct_change(i)
                  
                  features_df['volatility'] = close.rolling(window=14).std()
                  features_df['ema_fast'] = ema_fast
                  features_df['ema_slow'] = ema_slow
                  features_df['rsi'] = rsi_series
                  features_df['atr'] = atr_series
                  features_df['upper_doom'] = upper_doom
                  features_df['lower_doom'] = lower_doom
                  
                  # Kondisi Sinyal Tambahan dari Pine Script
                  features_df['buy_signal'] = ((ema_fast > ema_slow) & (rsi_series > 55) & (close > ema_fast)).astype(int)
                  features_df['sell_signal'] = ((ema_fast < ema_slow) & (rsi_series < 45) & (close < ema_fast)).astype(int)
                  features_df['doom_buy'] = (close < lower_doom).astype(int)
                  features_df['doom_sell'] = (close > upper_doom).astype(int)

                  # Triple Barrier Dua Arah (1 = Long Win, 0 = Short Win)
                  tp_pips, sl_pips, timeout = 3.0, 2.0, 5
                  labels = []
                  for i in range(len(close) - timeout):
                      ep = close.iloc[i]
                      hs = high.iloc[i+1:i+1+timeout]
                      ls = low.iloc[i+1:i+1+timeout]

                      hit_tp_long = (hs >= ep + tp_pips).any()
                      hit_sl_long = (ls <= ep - sl_pips).any()
                      hit_tp_short = (ls <= ep - tp_pips).any()
                      hit_sl_short = (hs >= ep + sl_pips).any()

                      if hit_tp_long and not hit_sl_long:
                          labels.append(1)
                      elif hit_tp_short and not hit_sl_short:
                          labels.append(0)
                      else:
                          labels.append(-2)

                  features_df['target'] = pd.Series(labels, index=features_df.index[:len(labels)])
                  features_df = features_df.dropna()
                  features_df = features_df[features_df['target'].isin([0, 1])]

                  X = features_df[[col for col in features_df.columns if col != 'target']]
                  y = features_df['target']

                  try:
                      n = len(X)
                      sample_weights = np.ones(n)
                      loss_vols = [
                          log.get("volatility_at_open")
                          for log in logs
                          if log.get("result") == "LOSS" and log.get("volatility_at_open") is not None
                      ]
                      if loss_vols:
                          vol_std = X['volatility'].std() or 1e-9
                          for lv in loss_vols:
                              close_mask = (X['volatility'] - lv).abs() <= vol_std
                              sample_weights = np.where(close_mask, sample_weights * 1.5, sample_weights)

                      probs = sample_weights / sample_weights.sum()
                      rng = np.random.RandomState(42)
                      resample_idx = rng.choice(n, size=n, replace=True, p=probs)
                      X_w = X.iloc[resample_idx]
                      y_w = y.iloc[resample_idx]

                      model = None
                      if os.path.exists(model_file):
                          try:
                              model = joblib.load(model_file)
                              model.named_steps["mlpclassifier"].warm_start = True
                              print("Model lama di-load, lanjut training (warm_start).")
                          except Exception as e:
                              print("Gagal load model lama, bikin model baru:", e)
                              model = None

                      if model is None:
                          model = make_pipeline(
                              StandardScaler(),
                              MLPClassifier(
                                  hidden_layer_sizes=(64, 32),
                                  max_iter=800,
                                  warm_start=True,
                                  random_state=42
                              )
                          )

                      model.fit(X_w, y_w)
                      joblib.dump(model, model_file)

                      meta_data["last_trained_date"] = current_date_str
                      meta_data["n_samples"] = n
                      with open(meta_file, "w") as f:
                          json.dump(meta_data, f, indent=2)
                      print(f"Model berhasil ditraining ulang dengan indikator Doomsday. n_samples={n}")
                  except Exception as e:
                      print("Error training model quant:", e)
              else:
                  print("Data training kosong, skip training kali ini.")
          else:
              print(f"Model hari ini ({current_date_str}) sudah ada, skip retrain.")

          # --- 4. PREDIKSI LIVE MENGGUNAKAN INDIKATOR TERBARU ---
          prediction, confidence = -1, 0
          live_vol_value = None
          df_live = yf.download("GC=F", period="5d", interval="60m")
          if isinstance(df_live.columns, pd.MultiIndex):
              df_live.columns = df_live.columns.get_level_values(0)

          if os.path.exists(model_file) and not df_live.empty:
              try:
                  close_live = df_live['Close'].squeeze()
                  high_live = df_live['High'].squeeze()
                  low_live = df_live['Low'].squeeze()

                  # Perhitungan indikator live persis seperti training
                  live_features = [(close_live.iloc[-1] - close_live.iloc[-1-i]) / close_live.iloc[-1-i] for i in range(1, 13)]
                  live_vol = close_live.rolling(window=14).std().iloc[-1]
                  live_vol_value = float(live_vol)
                  
                  ema_fast_live = close_live.ewm(span=9, adjust=False).mean().iloc[-1]
                  ema_slow_live = close_live.ewm(span=21, adjust=False).mean().iloc[-1]
                  
                  delta_live = close_live.diff()
                  gain_l = (delta_live.where(delta_live > 0, 0)).rolling(window=14).mean().iloc[-1]
                  loss_l = (-delta_live.where(delta_live < 0, 0)).rolling(window=14).mean().iloc[-1]
                  rs_l = gain_l / (loss_l + 1e-9)
                  rsi_live = 100 - (100 / (1 + rs_l))

                  tr1_l = high_live - low_live
                  tr2_l = (high_live - close_live.shift()).abs()
                  tr3_l = (low_live - close_live.shift()).abs()
                  tr_l = pd.concat([tr1_l, tr2_l, tr3_l], axis=1).max(axis=1)
                  atr_live = tr_l.rolling(window=14).mean().iloc[-1]

                  upper_doom_live = ema_fast_live + (atr_live * 2)
                  lower_doom_live = ema_fast_live - (atr_live * 2)
                  current_close_val = close_live.iloc[-1]

                  buy_sig_live = 1 if (ema_fast_live > ema_slow_live and rsi_live > 55 and current_close_val > ema_fast_live) else 0
                  sell_sig_live = 1 if (ema_fast_live < ema_slow_live and rsi_live < 45 and current_close_val < ema_fast_live) else 0
                  doom_buy_live = 1 if current_close_val < lower_doom_live else 0
                  doom_sell_live = 1 if current_close_val > upper_doom_live else 0

                  # Gabungkan seluruh fitur agar sesuai dengan dimensi model
                  complete_live_vector = live_features + [
                      live_vol, ema_fast_live, ema_slow_live, rsi_live, atr_live,
                      upper_doom_live, lower_doom_live, buy_sig_live, sell_sig_live,
                      doom_buy_live, doom_sell_live
                  ]

                  live_vector = np.array([complete_live_vector])
                  ml_model = joblib.load(model_file)
                  
                  pred_class = ml_model.predict(live_vector)[0]
                  proba = ml_model.predict_proba(live_vector)[0]
                  
                  prediction = int(pred_class)
                  confidence = int(max(proba) * 100)
              except Exception as e:
                  print("Error prediksi live:", e)

          # --- 5. EKSEKUSI SINYAL & LAPORAN TELEGRAM ---
          if not has_active_order:
              if confidence >= 85 and spot_price is not None:
                  arah_teks = "📈 BUY / NAIK" if prediction == 1 else "📉 SELL / TURUN"
                  ai_statement = "Setup tervalidasi oleh indikator Doomsday & Triple Barrier."
                  
                  if GEMINI_API_KEY:
                      try:
                          genai.configure(api_key=GEMINI_API_KEY)
                          gem_model = genai.GenerativeModel('gemini-2.5-flash')
                          prompt = f"Analis quant emas Doomsday: Spot ${spot_price}, prediksi {arah_teks}, confidence {confidence}%. Berikan 1 kalimat analisis risiko."
                          resp = gem_model.generate_content(prompt)
                          if resp and resp.text:
                              ai_statement = resp.text.strip()
                      except:
                          pass

                  new_log = {
                      "status": "OPEN",
                      "open_time": current_time_str,
                      "date": current_date_str,
                      "spot_price": spot_price,
                      "prediction": prediction,
                      "confidence": confidence,
                      "volatility_at_open": live_vol_value,
                      "close_price": None,
                      "result": None,
                      "diff_pips": 0,
                      "signed_pips": 0
                  }
                  logs.append(new_log)
                  if len(logs) > 200:
                      logs = logs[-200:]

                  with open(log_file, "w") as f:
                      json.dump(logs, f, indent=4)

                  def calc_stats(filtered_logs):
                      closed = [l for l in filtered_logs if l.get("status") == "CLOSED"]
                      total = len(closed)
                      if total == 0:
                          return 0, 0, 0.0, 0.0, "0W-0L (0.0%) | 0.0 pips"
                      wins = sum(1 for l in closed if l.get("result") == "WIN")
                      losses = sum(1 for l in closed if l.get("result") == "LOSS")
                      winrate = round((wins / total) * 100, 1)
                      total_pips = sum(l.get("signed_pips", 0) for l in closed)
                      return wins, losses, winrate, total_pips, f"{wins}W-{losses}L ({winrate}%) | {total_pips:+.1f} pips"

                  daily_logs = [l for l in logs if l.get("date") == current_date_str]
                  weekly_logs = [l for l in logs if l.get("close_time") and datetime.datetime.strptime(l["close_time"], "%Y-%m-%d %H:%M:%S").isocalendar()[:2] == (current_year, current_week)]
                  monthly_logs = [l for l in logs if l.get("close_time") and l["close_time"].startswith(current_year_month)]

                  w_w, w_l, w_wr, w_pips, stat_mingguan = calc_stats(weekly_logs)
                  _, _, _, _, stat_harian = calc_stats(daily_logs)
                  _, _, _, _, stat_bulanan = calc_stats(monthly_logs)

                  advisor_tip = "Sistem Doomsday berjalan optimal dengan arsitektur Quant murni."
                  if (w_w + w_l) >= 3 and w_wr < 40:
                      advisor_tip = "💡 *Saran AI:* Winrate mingguan di bawah 40%. Naikkan threshold confidence ke `90`."

                  msg_open = (
                      f"🟢 *[OPEN ORDER - DOOMSDAY QUANT]*\n"
                      f"-----------------------------\n"
                      f"⏱ *Waktu Entry:* `{current_time_str}` UTC\n"
                      f"💰 *Harga Entry:* `${spot_price}`\n"
                      f"🔮 *Posisi Baru:* *{arah_teks}*\n"
                      f"🎯 *Keyakinan AI:* `{confidence}%`\n\n"
                      f"📐 *Analisis:* _{ai_statement}_\n\n"
                      f"📈 *Statistik Performa:*\n"
                      f"• *Harian:* {stat_harian}\n"
                      f"• *Mingguan:* {stat_mingguan}\n"
                      f"• *Bulanan:* {stat_bulanan}\n\n"
                      f"{advisor_tip}"
                  )
                  send_telegram(msg_open)

          # --- 6. BACKUP MODEL KE GITHUB RELEASE ---
          last_backup_date = meta_data.get("last_backup_date")
          should_backup = False
          if os.path.exists(model_file):
              if last_backup_date is None:
                  should_backup = True
              else:
                  try:
                      last_dt = datetime.datetime.strptime(last_backup_date, "%Y-%m-%d").date()
                      if (now_utc.date() - last_dt).days >= 7:
                          should_backup = True
                  except:
                      should_backup = True

          backup_tag = f"model-backup-{current_date_str}"
          if should_backup:
              meta_data["last_backup_date"] = current_date_str
              with open(meta_file, "w") as f:
                  json.dump(meta_data, f, indent=2)
              print(f"Model akan di-backup ke GitHub Release: {backup_tag}")
          else:
              print(f"Backup terakhir: {last_backup_date}, belum 7 hari, skip backup.")

          gh_output_path = os.environ.get("GITHUB_OUTPUT")
          if gh_output_path:
              with open(gh_output_path, "a") as f:
                  f.write(f"should_backup={'true' if should_backup else 'false'}\n")
                  f.write(f"backup_tag={backup_tag}\n")
          EOF
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit changes (Hanya Log)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git stash
          git pull origin main --rebase || echo "No rebase needed"
          git stash pop || echo "No stash to pop"
          git add signal_log.json
          git commit -m "Update signal log with Doomsday Quant integration" || echo "No changes"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/dhntan88/doomsday.git HEAD:main

      - name: Weekly model backup to GitHub Release
        if: steps.quant_agent.outputs.should_backup == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.quant_agent.outputs.backup_tag }}"
          gh release create "$TAG" model_quant.pkl model_meta.json \
            --title "Model snapshot $TAG" \
            --notes "Weekly automated snapshot of Doomsday model_quant.pkl for portability." \
            || echo "Release $TAG sudah ada atau gagal dibuat, skip."
