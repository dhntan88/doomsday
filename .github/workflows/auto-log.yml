name: Auto Commit Signal Log + Telegram

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '*/15 * * * 1-5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests pandas numpy scikit-learn joblib yfinance google-generativeai

      - name: Run Advanced Autonomous Trading Agent (Optimized)
        run: |
          python - <<'EOF'
          import os, json, datetime, requests
          import pandas as pd
          import numpy as np
          import yfinance as yf
          import joblib
          from sklearn.neural_network import MLPClassifier
          from sklearn.preprocessing import StandardScaler
          from sklearn.pipeline import make_pipeline
          import google.generativeai as genai

          # --- 1. PENGAMAN WEEKEND & JUMAT MALAM (HINDARI GAP) ---
          now_utc = datetime.datetime.now(datetime.timezone.utc)
          current_weekday = now_utc.weekday()
          current_hour = now_utc.hour

          # Tutup operasi jika akhir pekan atau jumat lewat jam 20:00 UTC
          if current_weekday >= 5 or (current_weekday == 4 and current_hour >= 20):
              print("Market mendekati penutupan akhir pekan / sedang libur. Bot dihentikan sementara.")
              exit(0)

          TELEGRAM_BOT_TOKEN = os.getenv("TELEGRAM_BOT_TOKEN")
          TELEGRAM_CHAT_ID = os.getenv("TELEGRAM_CHAT_ID")
          GEMINI_API_KEY = os.getenv("GEMINI_API_KEY")

          def send_telegram(message):
              if not TELEGRAM_BOT_TOKEN or not TELEGRAM_CHAT_ID:
                  print("Telegram Token/Chat ID belum diset!")
                  return
              url = f"https://api.telegram.org/bot{TELEGRAM_BOT_TOKEN}/sendMessage"
              payload = {
                  "chat_id": TELEGRAM_CHAT_ID,
                  "text": message,
                  "parse_mode": "Markdown"
              }
              try:
                  requests.post(url, json=payload, timeout=10)
              except Exception as e:
                  print("Gagal kirim pesan ke Telegram:", e)

          print("Memulai Autonomous Agent Siklus XAUUSD (Optimized)...")

          # --- 2. AMBIL DATA HISTORIS & LIVE SPOT (YFINANCE GC=F) ---
          try:
              df_live = yf.download("GC=F", period="2d", interval="15m", progress=False)
              if isinstance(df_live.columns, pd.MultiIndex):
                  df_live.columns = df_live.columns.get_level_values(0)
              spot_price = float(df_live['Close'].iloc[-1])
              recent_change_pct = float(((df_live['Close'].iloc[-1] - df_live['Close'].iloc[-2]) / df_live['Close'].iloc[-2]) * 100)
          except Exception as e:
              print("Gagal mengambil data yfinance:", e)
              spot_price = None
              recent_change_pct = 0.0

          current_time_str = now_utc.strftime("%Y-%m-%d %H:%M:%S")
          current_date_str = now_utc.strftime("%Y-%m-%d")
          current_year_month = now_utc.strftime("%Y-%m")
          current_year, current_week, _ = now_utc.isocalendar()

          log_file = "signal_log.json"
          logs = []
          if os.path.exists(log_file):
              try:
                  with open(log_file, "r") as f:
                      logs = json.load(f)
              except:
                  logs = []

          has_active_order = False
          if logs:
              last_log = logs[-1]
              if last_log.get("status") == "OPEN":
                  has_active_order = True

          # --- 3. JIKA ADA ORDER AKTIF: TUTUP & EVALUASI ---
          if has_active_order and spot_price is not None:
              last_log = logs[-1]
              last_pred = last_log.get("prediction")
              last_price = last_log.get("spot_price")
              
              if last_price and last_pred is not None:
                  price_diff = spot_price - last_price
                  diff_pips = round(price_diff * 10, 1)
                  actual_direction = 1 if spot_price > last_price else (0 if spot_price < last_price else -1)
                  
                  is_win = (last_pred == actual_direction)
                  last_log["status"] = "CLOSED"
                  last_log["close_price"] = spot_price
                  last_log["close_time"] = current_time_str
                  last_log["result"] = "WIN" if is_win else "LOSS"
                  
                  signed_pips = abs(diff_pips) if is_win else -abs(diff_pips)
                      
                  last_log["diff_pips"] = abs(diff_pips)
                  last_log["signed_pips"] = signed_pips

                  status_icon = "✅ WIN" if is_win else "❌ LOSS"
                  arah_lama = "BUY" / "NAIK" if last_pred == 1 else "SELL / TURUN"
                  
                  msg_close = (
                      f"🔴 *[CLOSE ORDER - EVALUASI]*\n"
                      f"-----------------------------\n"
                      f"⏱ *Waktu Close:* `{current_time_str}` UTC\n"
                      f"💰 *Harga Close:* `${spot_price:.2f}`\n"
                      f"📌 *Order Asal:* {arah_lama} di `${last_price:.2f}`\n"
                      f"📊 *Hasil:* {status_icon} (`{signed_pips:+.1f}` pips)\n"
                      f"📏 *Perubahan:* `{abs(round(price_diff, 2))}` poin"
                  )
                  send_telegram(msg_close)
                  
                  with open(log_file, "w") as f:
                      json.dump(logs, f, indent=4)
                      
                  has_active_order = False

          # --- 4. TRAINING NEURAL NETWORK DENGAN FITUR LEBIH STABIL ---
          def get_long_df(interval, period):
              df = yf.download("GC=F", period=period, interval=interval, progress=False)
              if isinstance(df.columns, pd.MultiIndex):
                  df.columns = df.columns.get_level_values(0)
              return df

          df_train = get_long_df("60m", "6mo")
          if not df_train.empty and len(df_train) > 100:
              try:
                  close = df_train['Close'].squeeze()
                  features_df = pd.DataFrame(index=close.index)
                  
                  # Menggunakan rentang fitur persentase perubahan yang lebih compact
                  for i in range(1, 13):
                      features_df[f'lag_{i}'] = close.pct_change(i)
                  
                  # Tambahkan indikator sederhana Moving Average Ratio untuk meredam noise
                  features_df['ma_ratio'] = close / close.rolling(window=24).mean()

                  features_df['target'] = (close.shift(-1) > close).astype(int)
                  features_df = features_df.dropna()

                  X = features_df[[col for col in features_df.columns if col != 'target']]
                  y = features_df['target']

                  # Penalti Loss dinamis berdasarkan riwayat sebelumnya
                  sample_weights = np.ones(len(X))
                  if logs:
                      for log in logs:
                          if log.get("result") == "LOSS":
                              sample_weights = sample_weights * 1.02

                  model = make_pipeline(
                      StandardScaler(),
                      MLPClassifier(hidden_layer_sizes=(64, 32), max_iter=500, random_state=42, early_stopping=True)
                  )
                  model.fit(X, y, mlpclassifier__sample_weight=sample_weights)
                  joblib.dump(model, "model_pure.pkl")
              except Exception as e:
                  print("Error training:", e)

          prediction, confidence = -1, 0
          if os.path.exists("model_pure.pkl") and not df_train.empty:
              try:
                  close_live = df_train['Close'].squeeze()
                  live_features = [(close_live.iloc[-1] - close_live.iloc[-1-i]) / close_live.iloc[-1-i] for i in range(1, 13)]
                  ma_live_val = float(close_live.iloc[-1] / close_live.rolling(window=24).mean().iloc[-1])
                  live_features.append(ma_live_val)
                  
                  ml_model = joblib.load("model_pure.pkl")
                  pred_class = ml_model.predict(np.array([live_features]))[0]
                  proba = ml_model.predict_proba(np.array([live_features]))[0]
                  
                  prediction = int(pred_class)
                  confidence = int(max(proba) * 100)
              except Exception as e:
                  print("Error prediksi:", e)

          # --- 5. KEPUTUSAN FINAL + GEMINI AI NARATIVE ---
          if not has_active_order:
              # Threshold dinaikkan ke 65% atau 70% agar tidak terlalu sering trigger posisi salah
              if confidence >= 70 and spot_price is not None:
                  arah_teks = "📈 BUY / NAIK" if prediction == 1 else "📉 SELL / TURUN"
                  
                  ai_statement = f"Momentum 1 jam terakhir berubah {recent_change_pct:+.2f}%. Model neural network mendeteksi peluang probabilitas."
                  if GEMINI_API_KEY:
                      try:
                          genai.configure(api_key=GEMINI_API_KEY)
                          gemini_model = genai.GenerativeModel('gemini-1.5-flash')
                          prompt = f"Bertindaklah sebagai analis trading emas profesional. Harga spot XAUUSD ${spot_price:.2f}, perubahan {recent_change_pct:.2f}%. AI memprediksi arah {arah_teks} dengan keyakinan {confidence}%. Berikan 1 kalimat analisis pasar yang tajam dalam Bahasa Indonesia."
                          response = gemini_model.generate_content(prompt)
                          if response and response.text:
                              ai_statement = response.text.strip()
                      except Exception as e:
                          print("Gemini API error:", e)

                  new_log = {
                      "status": "OPEN",
                      "open_time": current_time_str,
                      "date": current_date_str,
                      "spot_price": spot_price,
                      "prediction": prediction,
                      "confidence": confidence,
                      "close_price": None,
                      "result": None,
                      "diff_pips": 0,
                      "signed_pips": 0
                  }
                  logs.append(new_log)
                  if len(logs) > 200:
                      logs = logs[-200:]

                  with open(log_file, "w") as f:
                      json.dump(logs, f, indent=4)

                  def calc_stats(filtered_logs):
                      closed = [l for l in filtered_logs if l.get("status") == "CLOSED"]
                      total = len(closed)
                      if total == 0:
                          return 0, 0, 0.0, 0.0, "0W-0L (0.0%) | 0.0 pips"
                      wins = sum(1 for l in closed if l.get("result") == "WIN")
                      losses = sum(1 for l in closed if l.get("result") == "LOSS")
                      winrate = round((wins / total) * 100, 1)
                      total_pips = sum(l.get("signed_pips", 0) for l in closed)
                      return wins, losses, winrate, total_pips, f"{wins}W-{losses}L ({winrate}%) | {total_pips:+.1f} pips"

                  daily_logs = [l for l in logs if l.get("date") == current_date_str]
                  weekly_logs = []
                  for l in logs:
                      if "close_time" in l and l["close_time"]:
                          try:
                              dt = datetime.datetime.strptime(l["close_time"], "%Y-%m-%d %H:%M:%S")
                              if dt.isocalendar()[0] == current_year and dt.isocalendar()[1] == current_week:
                                  weekly_logs.append(l)
                          except:
                              pass

                  monthly_logs = [l for l in logs if l.get("close_time") and l["close_time"].startswith(current_year_month)]

                  w_w, w_l, w_wr, w_pips, stat_mingguan = calc_stats(weekly_logs)
                  _, _, _, _, stat_harian = calc_stats(daily_logs)
                  _, _, _, _, stat_bulanan = calc_stats(monthly_logs)

                  advisor_tip = "Sistem berjalan optimal."
                  if (w_w + w_l) >= 3 and w_wr < 40:
                      advisor_tip = "💡 *Saran AI:* Winrate di bawah 40%."

                  msg_open = (
                      f"🟢 *[OPEN ORDER - ADVANCED AGENT]*\n"
                      f"-----------------------------\n"
                      f"⏱ *Waktu Entry:* `{current_time_str}` UTC\n"
                      f"💰 *Harga Entry:* `${spot_price:.2f}`\n"
                      f"🔮 *Posisi Baru:* *{arah_teks}*\n"
                      f"🎯 *Keyakinan AI:* `{confidence}%`\n\n"
                      f"🌐 *Analisis Makro:* _{ai_statement}_\n\n"
                      f"📈 *Statistik Performa:*\n"
                      f"• *Harian:* {stat_harian}\n"
                      f"• *Mingguan:* {stat_mingguan}\n"
                      f"• *Bulanan:* {stat_bulanan}\n\n"
                      f"{advisor_tip}"
                  )
                  send_telegram(msg_open)
                  print("Order baru berhasil dibuka.")
              else:
                  print(f"Bot istirahat (Wait & See). Confidence: {confidence}%")
          else:
              print("Menunggu siklus order aktif selesai.")
          EOF
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git pull origin main --rebase || echo "No rebase needed"
          git add model_pure.pkl signal_log.json
          git commit -m "Update Autonomous Agent model & signal logs [skip ci]" || echo "No changes"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/dhntan88/doomsday.git HEAD:main
