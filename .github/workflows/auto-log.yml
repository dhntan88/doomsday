name: Auto Commit Signal Log + Telegram

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '*/15 * * * 1-5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install requests pandas numpy scikit-learn joblib yfinance

      - name: Run Auto-Training & Telegram Signal Bot (Self-Correcting AI)
        run: |
          python - <<'EOF'
          import os, json, datetime, requests
          import pandas as pd
          import numpy as np
          import yfinance as yf
          import joblib
          from sklearn.neural_network import MLPClassifier
          from sklearn.preprocessing import StandardScaler
          from sklearn.pipeline import make_pipeline

          # --- PENGAMAN WEEKEND & JUMAT MALAM (HINDARI GAP) ---
          now_utc = datetime.datetime.now(datetime.timezone.utc)
          current_weekday = now_utc.weekday() # 0=Senin, 4=Jumat, 5=Sabtu, 6=Minggu
          current_hour = now_utc.hour

          if current_weekday >= 5 or (current_weekday == 4 and current_hour >= 20):
              print("Market mendekati penutupan akhir pekan / sedang libur. Bot dihentikan sementara untuk menghindari gap.")
              exit(0)

          TELEGRAM_BOT_TOKEN = os.getenv("TELEGRAM_BOT_TOKEN")
          TELEGRAM_CHAT_ID = os.getenv("TELEGRAM_CHAT_ID")

          def send_telegram(message):
              if not TELEGRAM_BOT_TOKEN or not TELEGRAM_CHAT_ID:
                  print("Telegram Token/Chat ID belum diset!")
                  return
              url = f"https://api.telegram.org/bot{TELEGRAM_BOT_TOKEN}/sendMessage"
              payload = {
                  "chat_id": TELEGRAM_CHAT_ID,
                  "text": message,
                  "parse_mode": "Markdown"
              }
              try:
                  requests.post(url, json=payload, timeout=10)
              except Exception as e:
                  print("Gagal kirim pesan ke Telegram:", e)

          print("Memulai proses training dengan Self-Correcting Learning (Belajar dari Error Log)...")

          # --- 1. Ambil Harga Spot Live ---
          try:
              r = requests.get("https://xaus.com/api/v1/spot")
              data = r.json()
              spot_price = float(data.get("spot_usd_oz"))
          except Exception as e:
              print("API xaus.com error:", e)
              spot_price = None

          current_time_str = now_utc.strftime("%Y-%m-%d %H:%M:%S")
          current_date_str = now_utc.strftime("%Y-%m-%d")
          current_year_month = now_utc.strftime("%Y-%m")
          
          # Hitung ISO Week untuk filter mingguan
          current_year, current_week, _ = now_utc.isocalendar()

          log_file = "signal_log.json"
          logs = []
          if os.path.exists(log_file):
              try:
                  with open(log_file, "r") as f:
                      logs = json.load(f)
              except:
                  logs = []

          has_active_order = False
          if logs:
              last_log = logs[-1]
              if last_log.get("status") == "OPEN":
                  has_active_order = True

          # --- 2. JIKA ADA ORDER AKTIF: TUTUP (CLOSE) DULU & CATAT ERRORNYA ---
          if has_active_order and spot_price is not None:
              last_log = logs[-1]
              last_pred = last_log.get("prediction")
              last_price = last_log.get("spot_price")
              
              if last_price and last_pred is not None:
                  price_diff = spot_price - last_price
                  diff_pips = round(price_diff * 10, 1)
                  actual_direction = 1 if spot_price > last_price else (0 if spot_price < last_price else -1)
                  
                  is_win = (last_pred == actual_direction)
                  last_log["status"] = "CLOSED"
                  last_log["close_price"] = spot_price
                  last_log["close_time"] = current_time_str
                  last_log["result"] = "WIN" if is_win else "LOSS"
                  # Jika win, pips positif; jika loss, pips negatif untuk akumulasi
                  signed_pips = diff_pips if (last_pred == 1 and spot_price > last_price) or (last_pred == 0 and spot_price < last_price) else -abs(diff_pips)
                  last_log["diff_pips"] = abs(diff_pips)
                  last_log["signed_pips"] = signed_pips

                  status_icon = "✅ WIN" if is_win else "❌ LOSS"
                  arah_lama = "BUY" if last_pred == 1 else "SELL"
                  
                  msg_close = (
                      f"🔴 *[CLOSE ORDER - EVALUASI]*\n"
                      f"-----------------------------\n"
                      f"⏱ *Waktu Close:* `{current_time_str}` UTC\n"
                      f"💰 *Harga Close:* `${spot_price}`\n"
                      f"📌 *Order Asal:* {arah_lama} di `${last_price}`\n"
                      f"📊 *Hasil:* {status_icon} (`{signed_pips:+.1f}` pips)\n"
                      f"📏 *Jarak:* `{abs(round(price_diff, 2))}` poin"
                  )
                  send_telegram(msg_close)
                  
                  with open(log_file, "w") as f:
                      json.dump(logs, f, indent=4)
                      
                  has_active_order = False

          # --- 3. TRAINING TINGKAT LANJUT: DATA HISTORIS + BOBOT KESALAHAN (LOSS PENALTY) ---
          def get_long_df(interval, period):
              df = yf.download("GC=F", period=period, interval=interval)
              if isinstance(df.columns, pd.MultiIndex):
                  df.columns = df.columns.get_level_values(0)
              return df

          df_macro = get_long_df("60m", "1y")
          if not df_macro.empty:
              try:
                  close = df_macro['Close'].squeeze()
                  features_df = pd.DataFrame(index=close.index)
                  for i in range(1, 49):
                      features_df[f'lag_{i}'] = close.pct_change(i)

                  features_df['target'] = (close.shift(-1) > close).astype(int)
                  features_df = features_df.dropna()

                  X = features_df[[col for col in features_df.columns if col != 'target']]
                  y = features_df['target']

                  sample_weights = np.ones(len(X))
                  if logs:
                      for log in logs:
                          if log.get("result") == "LOSS":
                              sample_weights = sample_weights * 1.01 

                  model = make_pipeline(
                      StandardScaler(),
                      MLPClassifier(hidden_layer_sizes=(128, 64, 32), max_iter=1000, random_state=42)
                  )
                  
                  model.fit(X, y, mlpclassifier__sample_weight=sample_weights)
                  joblib.dump(model, "model_pure.pkl")
              except Exception as e:
                  print("Error training dengan penalti error:", e)

          prediction, confidence = -1, 0
          df_live = get_long_df("60m", "60d")
          if not df_live.empty and os.path.exists("model_pure.pkl"):
              try:
                  close_live = df_live['Close'].squeeze()
                  live_features = [(close_live.iloc[-1] - close_live.iloc[-1-i]) / close_live.iloc[-1-i] for i in range(1, 49)]
                  
                  ml_model = joblib.load("model_pure.pkl")
                  pred_class = ml_model.predict(np.array([live_features]))[0]
                  proba = ml_model.predict_proba(np.array([live_features]))[0]
                  
                  prediction = int(pred_class)
                  confidence = int(max(proba) * 100)
              except Exception as e:
                  print("Error prediksi:", e)

          # --- 4. KEPUTUSAN FINAL DENGAN FILTER KETAT (CONFIDENCE >= 85%) ---
          if not has_active_order:
              if confidence >= 85 and spot_price is not None:
                  arah_teks = "📈 BUY / NAIK" if prediction == 1 else "📉 SELL / TURUN"
                  ai_statement = "Analisis diperbarui dengan koreksi riwayat error sebelumnya."

                  new_log = {
                      "status": "OPEN",
                      "open_time": current_time_str,
                      "date": current_date_str,
                      "spot_price": spot_price,
                      "prediction": prediction,
                      "confidence": confidence,
                      "close_price": None,
                      "result": None,
                      "diff_pips": 0,
                      "signed_pips": 0
                  }
                  logs.append(new_log)
                  if len(logs) > 200:
                      logs = logs[-200:]

                  with open(log_file, "w") as f:
                      json.dump(logs, f, indent=4)

                  # --- KALKULATOR STATISTIK (HARIAN, MINGGUAN, BULANAN) ---
                  def calc_stats(filtered_logs):
                      closed = [l for l in filtered_logs if l.get("status") == "CLOSED"]
                      total = len(closed)
                      if total == 0:
                          return "0 Win / 0 Loss (WinRate: 0% | 0.0 Pips)"
                      wins = sum(1 for l in closed if l.get("result") == "WIN")
                      losses = sum(1 for l in closed if l.get("result") == "LOSS")
                      winrate = round((wins / total) * 100, 1)
                      total_pips = sum(l.get("signed_pips", 0) for l in closed)
                      return f"{wins}W-{losses}L ({winrate}%) | {total_pips:+.1f} pips"

                  # Filter Harian
                  daily_logs = [l for l in logs if l.get("date") == current_date_str]
                  
                  # Filter Mingguan
                  weekly_logs = []
                  for l in logs:
                      if "close_time" in l and l["close_time"]:
                          try:
                              dt = datetime.datetime.strptime(l["close_time"], "%Y-%m-%d %H:%M:%S")
                              if dt.isocalendar()[0] == current_year and dt.isocalendar()[1] == current_week:
                                  weekly_logs.append(l)
                          except:
                              pass

                  # Filter Bulanan
                  monthly_logs = []
                  for l in logs:
                      if "close_time" in l and l["close_time"]:
                          if l["close_time"].startswith(current_year_month):
                              monthly_logs.append(l)

                  stat_harian = calc_stats(daily_logs)
                  stat_mingguan = calc_stats(weekly_logs)
                  stat_bulanan = calc_stats(monthly_logs)
                  
                  msg_open = (
                      f"🟢 *[OPEN ORDER BARU - SELF-CORRECTED]*\n"
                      f"-----------------------------\n"
                      f"⏱ *Waktu Entry:* `{current_time_str}` UTC\n"
                      f"💰 *Harga Entry:* `${spot_price}`\n"
                      f"🔮 *Posisi Baru:* *{arah_teks}*\n"
                      f"🎯 *Keyakinan AI:* `{confidence}%`\n\n"
                      f"💬 *Analisis:* _{ai_statement}_\n\n"
                      f"📈 *Statistik Performa:*\n"
                      f"• *Harian:* {stat_harian}\n"
                      f"• *Mingguan:* {stat_mingguan}\n"
                      f"• *Bulanan:* {stat_bulanan}"
                  )
                  send_telegram(msg_open)
                  print("Order baru dibuka dengan statistik lengkap.")
              else:
                  print(f"Bot istirahat (Wait & See). Confidence: {confidence}% (Belum cukup kuat untuk koreksi).")
          else:
              print("Menunggu siklus order aktif selesai.")
          EOF
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git stash
          git pull origin main --rebase || echo "No rebase needed"
          git stash pop || echo "No stash to pop"
          git add model_pure.pkl signal_log.json
          git commit -m "Add daily, weekly, monthly winrate and pips tracking stats" || echo "No changes"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/dhntan88/doomsday.git HEAD:main
